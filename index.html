<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鹿児島市 3D交通量統合モニター (様式1〜4対応)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #111827; }
    
    /* PC表示用レイアウト（横並び） */
    #sidebar {
      width: 370px;
      height: 100%;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 16px rgba(0,0,0,0.4);
      z-index: 10;
      transition: all 0.3s ease;
    }
    .sidebar-header {
      padding: 14px 16px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      position: relative;
    }
    .sidebar-header h2 { margin: 0 0 6px 0; font-size: 15px; color: #60a5fa; }
    
    .status-text { margin: 6px 0 0 0; font-size: 11px; color: #10b981; }
    
    .ranking-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .ranking-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: #1f2937;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }
    .ranking-item:hover, .ranking-item:active {
      background: #374151;
      border-left-color: #60a5fa;
    }
    .rank-num { width: 24px; font-size: 14px; font-weight: bold; color: #9ca3af; }
    .station-info { flex: 1; margin-left: 6px; }
    .station-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
    .station-sub { font-size: 11px; color: #9ca3af; }
    .traffic-val { text-align: right; font-size: 15px; font-weight: bold; color: #f59e0b; }
    .traffic-unit { font-size: 10px; color: #9ca3af; font-weight: normal; }

    #map { flex: 1; height: 100%; position: relative; background: #0b132b; }
    
    .legend {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      gap: 10px;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-color { width: 10px; height: 10px; border-radius: 2px; }

    .popup-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
    .popup-table th, .popup-table td { border: 1px solid #d1d5db; padding: 4px 6px; text-align: center; }
    .popup-table th { background: #f3f4f6; color: #374151; }

    /* モバイル専用切り替えボタン（初期は非表示） */
    #mobile-toggle-bar {
      display: none;
      background: #2563eb;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    /* ============================================================
       スマートフォン向けスタイル (画面幅 768px 以下)
       ============================================================ */
    @media screen and (max-width: 768px) {
      body { flex-direction: column-reverse; }

      #map {
        width: 100%;
        height: 100%;
        flex: 1;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: 48vh; /* 画面下半分に収める */
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
        border-top-left-radius: 14px;
        border-top-right-radius: 14px;
        overflow: hidden;
      }

      #mobile-toggle-bar {
        display: block;
        border-top-left-radius: 14px;
        border-top-right-radius: 14px;
      }

      .sidebar-header {
        padding: 10px 14px;
      }

      .sidebar-header h2 {
        font-size: 13px;
      }

      /* 折りたたみ時の挙動 */
      #sidebar.collapsed {
        max-height: 42px; /* バーのみ表示 */
      }
      #sidebar.collapsed .sidebar-header,
      #sidebar.collapsed .ranking-list {
        display: none;
      }

      .legend {
        top: auto;
        bottom: 54px;
        right: 10px;
        font-size: 10px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="mobile-toggle-bar" onclick="toggleSidebar()">
    <span id="toggle-icon">▼</span> 交通量ランキング一覧（タップで開閉）
  </div>
  <div class="sidebar-header">
    <h2>鹿児島市 交通量統合モニター (全15地点)</h2>
    <p class="status-text" id="status-label">● 待機中</p>
  </div>
  <div class="ranking-list" id="ranking-container"></div>
</div>

<div id="map">
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #3b82f6;"></div> 上り</div>
    <div class="legend-item"><div class="legend-color" style="background: #ef4444;"></div> 下り</div>
  </div>
</div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tile.openstreetmap.jp/styles/osm-bright-ja/style.json',
    center: [130.5500, 31.5850],
    zoom: 11.5,
    pitch: 55,
    bearing: -15
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  let currentPopup = null;
  let allStations = [];

  // スマホ用の開閉トグル関数
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const icon = document.getElementById('toggle-icon');
    sidebar.classList.toggle('collapsed');
    icon.innerText = sidebar.classList.contains('collapsed') ? '▲' : '▼';
  }

  function flyToStation(st) {
    map.flyTo({
      center: [st.lng, st.lat],
      zoom: 16.2,
      pitch: 65,
      bearing: -15,
      speed: 1.2
    });

    // スマホ時は地点を選択したら邪魔にならないよう自動で下部パネルを閉じる
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.add('collapsed');
      document.getElementById('toggle-icon').innerText = '▲';
    }

    if (currentPopup) currentPopup.remove();

    function fmt5m(f) {
      if (!f) return '<td>-</td><td>-</td><td>-</td><td>-</td>';
      return `<td>${f.up_s ?? '-'}</td><td>${f.up_l ?? '-'}</td><td>${f.down_s ?? '-'}</td><td>${f.down_l ?? '-'}</td>`;
    }

    function fmt1h(f) {
      if (!f) return '<td>-</td><td>-</td><td>-</td><td>-</td>';
      const us = f.up_s ?? (f.up_tot != null ? `${f.up_tot}(全)` : '-');
      const ds = f.down_s ?? (f.down_tot != null ? `${f.down_tot}(全)` : '-');
      return `<td>${us}</td><td>${f.up_l ?? '-'}</td><td>${ds}</td><td>${f.down_l ?? '-'}</td>`;
    }

    const popupHtml = `
      <div style="font-size:12px; min-width: 260px; color:#111;">
        <h4 style="margin:0 0 2px 0; color:#1e40af; font-size:14px;">観測点: ${st.code}</h4>
        <div style="color:#666; font-size:11px; margin-bottom:6px;">種別: ${st.type}</div>
        
        <table class="popup-table">
          <tr>
            <th rowspan="2">様式</th>
            <th colspan="2" style="color:#2563eb;">上り</th>
            <th colspan="2" style="color:#dc2626;">下り</th>
          </tr>
          <tr>
            <th>小型</th><th>大型</th><th>小型</th><th>大型</th>
          </tr>
          <tr><td>様式1 (常設5分)</td>${fmt5m(st.f1)}</tr>
          <tr><td>様式2 (常設1時間)</td>${fmt1h(st.f2)}</tr>
          <tr><td>様式3 (CCTV 5分)</td>${fmt5m(st.f3)}</tr>
          <tr><td>様式4 (CCTV 1時間)</td>${fmt1h(st.f4)}</tr>
        </table>
      </div>
    `;

    currentPopup = new maplibregl.Popup({ offset: 20 })
      .setLngLat([st.lng, st.lat])
      .setHTML(popupHtml)
      .addTo(map);
  }

  function createPillarPolygon(centerLng, centerLat, radiusMeters, heightMeters, direction, meta) {
    const coords = [];
    const steps = 14;
    const latOffset = radiusMeters / 111000;
    const lngOffset = radiusMeters / (111000 * Math.cos(centerLat * Math.PI / 180));

    for (let i = 0; i <= steps; i++) {
      const angle = (i / steps) * 2 * Math.PI;
      coords.push([
        centerLng + lngOffset * Math.cos(angle),
        centerLat + latOffset * Math.sin(angle)
      ]);
    }

    return {
      "type": "Feature",
      "geometry": { "type": "Polygon", "coordinates": [coords] },
      "properties": {
        "direction": direction,
        "height": Math.max(heightMeters, 15),
        "code": meta.code
      }
    };
  }

  async function loadTrafficData() {
    const statusLabel = document.getElementById('status-label');
    try {
      const res = await fetch('./traffic_data.json');
      const data = await res.json();
      allStations = data;
      statusLabel.innerText = `● 全 ${data.length} 地点のデータ表示中`;

      const pillarFeatures = [];

      data.forEach(st => {
        let upVal = 0;
        let downVal = 0;

        if (st.f4) {
          upVal = (st.f4.up_tot || (st.f4.up_s + st.f4.up_l)) || 0;
          downVal = (st.f4.down_tot || (st.f4.down_s + st.f4.down_l)) || 0;
        } else if (st.f2) {
          upVal = (st.f2.up_s + st.f2.up_l) || 0;
          downVal = (st.f2.down_s + st.f2.down_l) || 0;
        } else if (st.f1) {
          upVal = ((st.f1.up_s + st.f1.up_l) || 0) * 12;
          downVal = ((st.f1.down_s + st.f1.down_l) || 0) * 12;
        }

        st.totalDisplay = upVal + downVal;
        st.upDisplay = upVal;
        st.downDisplay = downVal;

        pillarFeatures.push(createPillarPolygon(
          st.lng - 0.00022, st.lat, 16, upVal * 0.35, '上り', { code: st.code }
        ));
        pillarFeatures.push(createPillarPolygon(
          st.lng + 0.00022, st.lat, 16, downVal * 0.35, '下り', { code: st.code }
        ));
      });

      data.sort((a, b) => b.totalDisplay - a.totalDisplay);

      const listContainer = document.getElementById('ranking-container');
      listContainer.innerHTML = '';

      data.forEach((st, idx) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        item.innerHTML = `
          <div class="rank-num">${idx + 1}</div>
          <div class="station-info">
            <div class="station-name">地点: ${st.code} (${st.type})</div>
            <div class="station-sub">上り:${st.upDisplay} / 下り:${st.downDisplay}</div>
          </div>
          <div class="traffic-val">${st.totalDisplay} <span class="traffic-unit">台/時</span></div>
        `;
        item.onclick = () => flyToStation(st);
        listContainer.appendChild(item);
      });

      if (map.getSource('traffic-pillars')) {
        map.getSource('traffic-pillars').setData({
          type: 'FeatureCollection',
          features: pillarFeatures
        });
      } else {
        map.addSource('traffic-pillars', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: pillarFeatures }
        });

        map.addLayer({
          'id': 'traffic-pillars-3d',
          'type': 'fill-extrusion',
          'source': 'traffic-pillars',
          'paint': {
            'fill-extrusion-color': [
              'match', ['get', 'direction'],
              '上り', '#3b82f6',
              '下り', '#ef4444',
              '#fbbf24'
            ],
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': 0,
            'fill-extrusion-opacity': 0.92
          }
        });

        map.on('click', 'traffic-pillars-3d', (e) => {
          const code = e.features[0].properties.code;
          const st = allStations.find(s => s.code == code);
          if (st) flyToStation(st);
        });
      }

    } catch (err) {
      console.error(err);
      statusLabel.innerText = '✕ データ読み込みエラー';
    }
  }

  map.on('load', () => {
    if (map.getSource('openmaptiles')) {
      map.addLayer({
        'id': '3d-buildings',
        'source': 'openmaptiles',
        'source-layer': 'building',
        'type': 'fill-extrusion',
        'minzoom': 13,
        'paint': {
          'fill-extrusion-color': '#b0bec5',
          'fill-extrusion-height': ['case', ['has', 'render_height'], ['get', 'render_height'], 14],
          'fill-extrusion-base': ['case', ['has', 'render_min_height'], ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.82
        }
      });
    }

    loadTrafficData();
  });
</script>

</body>
</html>
