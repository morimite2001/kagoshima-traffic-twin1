<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鹿児島市周辺 3D交通量モニター（国土交通省 交通量API・参考値）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #111827; }
    #app { flex: 1; min-height: 0; display: flex; position: relative; }
    
    /* PC表示用レイアウト（横並び） */
    #sidebar {
      width: 370px;
      height: 100%;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 16px rgba(0,0,0,0.4);
      z-index: 10;
      transition: all 0.3s ease;
    }
    .sidebar-header {
      padding: 14px 16px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      position: relative;
    }
    .sidebar-header h2 { margin: 0 0 6px 0; font-size: 15px; color: #60a5fa; }
    
    .status-text { margin: 6px 0 0 0; font-size: 11px; line-height: 1.6; color: #10b981; }
    .status-text.warn { color: #f59e0b; }
    .status-text .sub { color: #9ca3af; }
    
    .ranking-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .ranking-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: #1f2937;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }
    .ranking-item:hover, .ranking-item:active {
      background: #374151;
      border-left-color: #60a5fa;
    }
    .rank-num { width: 24px; font-size: 14px; font-weight: bold; color: #9ca3af; }
    .station-info { flex: 1; margin-left: 6px; }
    .station-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
    .station-sub { font-size: 11px; color: #9ca3af; }
    .traffic-val { text-align: right; font-size: 15px; font-weight: bold; color: #f59e0b; }
    .traffic-unit { font-size: 10px; color: #9ca3af; font-weight: normal; }

    #map { flex: 1; height: 100%; position: relative; background: #0b132b; }
    
    .legend {
      position: absolute;
      top: 14px;
      right: 56px; /* 右上のズームボタンと重ならない位置 */
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      gap: 10px;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-color { width: 10px; height: 10px; border-radius: 2px; }

    /* ポップアップが画面からはみ出さないよう、高さを制限してスクロールさせる */
    .popup-body { max-height: 58vh; overflow-y: auto; }
    @media (max-width: 768px) {
      .popup-body { max-height: 40vh; }
      /* スマホでは、地図上の位置に合わせず、画面上部に幅いっぱいで表示する（左端や下部で切れないように） */
      .maplibregl-popup { position: fixed !important; top: 8px !important; left: 8px !important; right: 8px !important; transform: none !important; max-width: none !important; }
      .maplibregl-popup-tip { display: none !important; }
      .maplibregl-popup-content { width: 100%; box-sizing: border-box; }
    }
    .popup-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
    .popup-table th, .popup-table td { border: 1px solid #d1d5db; padding: 4px 6px; text-align: center; }
    .popup-table th { background: #f3f4f6; color: #374151; }

    /* 出典・免責表示（常に画面下部に表示。交通量API利用規約 第5条・第8条） */
    #attribution {
      flex: none;
      background: #0b1220;
      color: #9ca3af;
      font-size: 10.5px;
      line-height: 1.5;
      padding: 6px 12px;
      border-top: 1px solid #374151;
      z-index: 20;
    }
    #attribution strong { color: #d1d5db; }
    #attribution a { color: #93c5fd; }

    /* モバイル専用切り替えボタン（初期は非表示） */
    #mobile-toggle-bar {
      display: none;
      background: #2563eb;
      color: #fff;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    /* ============================================================
       スマートフォン向けスタイル (画面幅 768px 以下)
       ============================================================ */
    @media screen and (max-width: 768px) {
      #app { flex-direction: column-reverse; }
      #attribution { font-size: 9.5px; padding: 5px 10px; }

      #map {
        width: 100%;
        height: 100%;
        flex: 1;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: 48vh; /* 画面下半分に収める */
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
        border-top-left-radius: 14px;
        border-top-right-radius: 14px;
        overflow: hidden;
      }

      #mobile-toggle-bar {
        display: block;
        border-top-left-radius: 14px;
        border-top-right-radius: 14px;
      }

      .sidebar-header {
        padding: 10px 14px;
      }

      .sidebar-header h2 {
        font-size: 13px;
      }

      /* 折りたたみ時の挙動 */
      #sidebar.collapsed {
        max-height: 42px; /* バーのみ表示 */
      }
      #sidebar.collapsed .sidebar-header,
      #sidebar.collapsed .ranking-list {
        display: none;
      }

      .legend {
        top: auto;
        bottom: 54px;
        right: 10px;
        font-size: 10px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

<div id="app">
<div id="sidebar">
  <div id="mobile-toggle-bar" onclick="toggleSidebar()">
    <span id="toggle-icon">▼</span> 交通量ランキング一覧（タップで開閉）
  </div>
  <div class="sidebar-header">
    <h2>鹿児島市周辺 交通量モニター</h2>
    <p class="status-text" id="status-label">● 読み込み中…</p>
  </div>
  <div class="ranking-list" id="ranking-container"></div>
</div>

<div id="map">
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #3b82f6;"></div> 上り</div>
    <div class="legend-item"><div class="legend-color" style="background: #ef4444;"></div> 下り</div>
    <div class="legend-item"><div class="legend-color" style="background: #6b7280;"></div> データなし・欠測</div>
  </div>
</div>
</div><!-- /#app -->

<footer id="attribution">
  <div><strong>出典:</strong> 国土交通省 API 機能による交通量(参考値)を加工して作成</div>
  <div>このサービスは、交通量 API 機能を使用していますが、サービスの内容は国土交通省によって保証されたものではありません。表示値は気象状況・機器状況等により不正確となる場合がある参考値で、国土交通省による正式な交通量の調査結果ではありません。本サービスに関する一切の責任は運営者が負います。
    データ提供元: <a href="https://www.jartic-open-traffic.org/" target="_blank" rel="noopener">交通量データの提供（オープンデータ）</a></div>
</footer>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tile.openstreetmap.jp/styles/osm-bright-ja/style.json',
    center: [130.5500, 31.5850],
    zoom: 11.5,
    pitch: 55,
    bearing: -15
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  let currentPopup = null;
  let seriesData = null; // traffic_series.json（過去1時間の5分間交通量）
  let allStations = [];

  // スマホ用の開閉トグル関数
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const icon = document.getElementById('toggle-icon');
    sidebar.classList.toggle('collapsed');
    icon.innerText = sidebar.classList.contains('collapsed') ? '▲' : '▼';
  }

  function flyToStation(st) {
    map.flyTo({
      center: [st.lng, st.lat],
      zoom: 16.2,
      pitch: 65,
      bearing: -15,
      speed: 1.2,
      // 地点を画面の少し下に寄せ、上側にポップアップの表示スペースを確保する
      offset: [0, Math.round(window.innerHeight * 0.2)]
    });

    // スマホ時は地点を選択したら邪魔にならないよう自動で下部パネルを閉じる
    if (window.innerWidth <= 768) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.add('collapsed');
      document.getElementById('toggle-icon').innerText = '▲';
    }

    if (currentPopup) currentPopup.remove();

    // 値が空(null)の場合は「欠測」、そもそも該当する様式の地点でない場合は「-」
    // 車種判別不能(up_u/down_u)は古い形式のJSONには無いので、その場合は「-」
    const vu = (x) => (x === undefined ? '-' : (x ?? '欠測'));
    function fmt5m(f) {
      if (!f) return '<td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>';
      const v = (x) => x ?? '欠測';
      return `<td>${v(f.up_s)}</td><td>${v(f.up_l)}</td><td>${vu(f.up_u)}</td><td>${v(f.down_s)}</td><td>${v(f.down_l)}</td><td>${vu(f.down_u)}</td>`;
    }

    function fmt1h(f) {
      if (!f) return '<td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>';
      const us = f.up_s ?? (f.up_tot != null ? `${f.up_tot}(全)` : '欠測');
      const ds = f.down_s ?? (f.down_tot != null ? `${f.down_tot}(全)` : '欠測');
      return `<td>${us}</td><td>${f.up_l ?? '欠測'}</td><td>${vu(f.up_u)}</td><td>${ds}</td><td>${f.down_l ?? '欠測'}</td><td>${vu(f.down_u)}</td>`;
    }

    const reasons = stationReasons(st);

    const popupHtml = `
      <div class="popup-body" style="font-size:12px; min-width: 260px; color:#111;">
        <h4 style="margin:0 0 2px 0; color:#1e40af; font-size:14px;">観測点: ${st.code}</h4>
        <div style="color:#666; font-size:11px; margin-bottom:6px;">種別: ${st.type}</div>
        
        <table class="popup-table">
          <tr>
            <th rowspan="2">様式</th>
            <th colspan="3" style="color:#2563eb;">上り</th>
            <th colspan="3" style="color:#dc2626;">下り</th>
          </tr>
          <tr>
            <th>小型</th><th>大型</th><th title="車種判別不能">不明</th><th>小型</th><th>大型</th><th title="車種判別不能">不明</th>
          </tr>
          <tr><td>様式1 (常設5分)</td>${fmt5m(st.f1)}</tr>
          <tr><td>様式2 (常設1時間)</td>${fmt1h(st.f2)}</tr>
          <tr><td>様式3 (CCTV 5分)</td>${fmt5m(st.f3)}</tr>
          <tr><td>様式4 (CCTV 1時間)</td>${fmt1h(st.f4)}</tr>
        </table>
        <div style="margin-top:4px; color:#6b7280; font-size:10px;">不明＝小型・大型に判別できなかった台数（合計には含めています）</div>
        ${buildSeriesChart(st)}
        ${reasons.length ? `<div style="margin-top:6px; color:#b45309; font-size:11px;">⚠ 観測側の異常フラグ: ${reasons.join('、')}（取得時点のフラグ）</div>` : ''}
      </div>
    `;

    currentPopup = new maplibregl.Popup({ offset: 20, maxWidth: '420px' })
      .setLngLat([st.lng, st.lat])
      .setHTML(popupHtml)
      .addTo(map);
  }

  // ---- 過去1時間の5分間交通量グラフ（traffic_series.json）----
  const SLOT_COUNT = 13; // 5分刻みで60分 = 13点
  const COLOR_UP = '#3b82f6';
  const COLOR_DOWN = '#ef4444';

  function jstCodeFromMs(ms) {
    const j = new Date(ms + 9 * 3600000);
    const p2 = (n) => String(n).padStart(2, '0');
    return `${j.getUTCFullYear()}${p2(j.getUTCMonth() + 1)}${p2(j.getUTCDate())}${p2(j.getUTCHours())}${p2(j.getUTCMinutes())}`;
  }

  // 3点移動平均（null は無視。窓内がすべて null なら null）
  function movingAvg(arr) {
    return arr.map((_, i) => {
      const w = arr.slice(Math.max(0, i - 1), i + 2).filter((v) => v !== null);
      return w.length ? w.reduce((a, b) => a + b, 0) / w.length : null;
    });
  }

  function niceMax(v) {
    const pow = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
    for (const m of [1, 2, 5, 10]) { if (m * pow >= v) return m * pow; }
    return 10 * pow;
  }

  // 1方向ぶんの傾向を判定する（約1時間前の3点平均と、直近の3点平均を比べる）
  function trendOf(vals) {
    const avg = (xs) => { const a = xs.filter((v) => v !== null); return a.length >= 2 ? a.reduce((x, y) => x + y, 0) / a.length : null; };
    const first = avg(vals.slice(0, 3));
    const last = avg(vals.slice(SLOT_COUNT - 3));
    if (first === null || last === null) return null;
    const diff = last - first;
    let label = '横ばい';
    if (Math.abs(diff) >= 3 && Math.abs(diff) / Math.max(first, 1) >= 0.1) label = diff > 0 ? '増加傾向' : '減少傾向';
    return { label, first: Math.round(first), last: Math.round(last) };
  }

  // 上り・下りそれぞれの傾向を2行で表示する
  function trendLines(up, down) {
    const line = (name, color, vals) => {
      const t = trendOf(vals);
      const head = `<span style="color:${color};">■</span> ${name}: `;
      if (!t) return `${head}判定に必要なデータが足りません`;
      return `${head}<b>${t.label}</b>（約1時間前 ${t.first} → 直近 ${t.last} 台/5分）`;
    };
    return `${line('上り', COLOR_UP, up)}<br>${line('下り', COLOR_DOWN, down)}`;
  }

  function buildSeriesChart(st) {
    const head = '<div style="margin-top:8px; font-weight:600; font-size:11px; color:#374151;">過去1時間の5分間交通量</div>';
    const msg = (t) => `${head}<div style="color:#6b7280; font-size:11px; margin-top:4px;">${t}</div>`;
    if (!seriesData) return msg('グラフ用データを読み込めませんでした（次回の更新後に表示されます）。');
    const info = seriesData.stations && seriesData.stations[st.code];
    if (!info || !seriesData.latest) return msg('この地点のグラフ用データはありません。');

    const baseMs = parseTc(String(seriesData.latest)).date.getTime();
    const slots = [];
    for (let k = 0; k < SLOT_COUNT; k++) slots.push(baseMs - (SLOT_COUNT - 1 - k) * 300000);
    const byT = {};
    (info.points || []).forEach((p) => { byT[p.t] = p; });
    const pick = (key) => slots.map((ms) => { const p = byT[jstCodeFromMs(ms)]; return p && typeof p[key] === 'number' ? p[key] : null; });
    const up = pick('up');
    const down = pick('down');
    const total = up.map((u, i) => (u === null && down[i] === null ? null : (u || 0) + (down[i] || 0)));
    if (total.every((v) => v === null)) return msg('グラフにできるデータがありません（欠測またはデータなし）。');

    const W = 360, H = 150, L = 34, R = 8, T = 10, B = 26;
    const plotW = W - L - R, plotH = H - T - B;
    const maxV = niceMax(Math.max(1, ...up.concat(down).filter((v) => v !== null)));
    const x = (i) => L + plotW * i / (SLOT_COUNT - 1);
    const y = (v) => T + plotH * (1 - v / maxV);
    const path = (vals) => {
      let d = '', pen = false;
      vals.forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
        pen = true;
      });
      return d;
    };
    const dots = (vals, color) => vals.map((v, i) => (v === null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.8" fill="${color}" fill-opacity="0.55"/>`)).join('');
    const grid = [0, maxV / 2, maxV].map((v) => `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}" stroke="#e5e7eb"/><text x="${L - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#6b7280">${Math.round(v)}</text>`).join('');
    const hhmm = (ms) => { const c = jstCodeFromMs(ms); return `${c.slice(8, 10)}:${c.slice(10, 12)}`; };
    const xl = [[0, 'start'], [6, 'middle'], [12, 'end']].map(([i, a]) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${a}" font-size="9" fill="#6b7280">${hhmm(slots[i])}</text>`).join('');
    const svg = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block; margin-top:4px;" role="img" aria-label="過去1時間の5分間交通量の折れ線グラフ">
        ${grid}${xl}
        <path d="${path(up)}" fill="none" stroke="${COLOR_UP}" stroke-opacity="0.35" stroke-width="1"/>
        <path d="${path(down)}" fill="none" stroke="${COLOR_DOWN}" stroke-opacity="0.35" stroke-width="1"/>
        ${dots(up, COLOR_UP)}${dots(down, COLOR_DOWN)}
        <path d="${path(movingAvg(up))}" fill="none" stroke="${COLOR_UP}" stroke-width="2"/>
        <path d="${path(movingAvg(down))}" fill="none" stroke="${COLOR_DOWN}" stroke-width="2"/>
      </svg>`;
    const legend = `<span style="color:${COLOR_UP};">■</span> 上り　<span style="color:${COLOR_DOWN};">■</span> 下り　<span style="color:#6b7280;">単位: 台/5分（時刻は日本時間）</span>`;
    return `${head}
      <div style="color:#b45309; font-size:10px; margin-top:2px;">※ 約20〜50分遅れ・渋滞の度合いを示すものではありません</div>
      <div style="font-size:10px; margin-top:2px;">${legend}</div>
      ${svg}
      <div style="font-size:11px; color:#374151; margin-top:2px; line-height:1.7;">${trendLines(up, down)}</div>
      <div style="margin-top:4px; color:#b45309; font-size:10px; line-height:1.5;">※ 観測から約20〜50分遅れの交通量です。<b>渋滞の度合いを示すものではありません</b>（混雑時は台数が減ることもあります）。実線は3点移動平均、薄い線と点は実測値です。</div>`;
  }

  // ---- 観測側の異常フラグ（traffic_data.json の flags）を読む補助関数 ----
  // 項目名の全角/半角の違いを吸収して比較する
  const nz = (str) => String(str).normalize('NFKC').replace(/\s/g, '');

  function flagIsOn(flags, name) {
    if (!flags) return false;
    const target = nz(name);
    for (const k of Object.keys(flags)) {
      if (nz(k) === target) return String(flags[k]) === '1';
    }
    return false;
  }

  // CCTV(様式3の5分値)で「1:異常」のときに理由として表示するフラグ
  const CCTV_FLAG_LABELS = [
    ['カメラプリセット位置', 'カメラ位置異常'],
    ['気象影響による映像不良', '気象による映像不良'],
    ['照度不足', '照度不足'],
    ['サーバの稼働', 'サーバ異常'],
    ['カメラの映像受信', 'カメラ映像の受信異常'],
    ['映像のデコード処理', '映像デコード異常'],
    ['デコード映像から映像解析機能への取込加工処理の失敗', '映像取込処理の失敗'],
    ['映像解析機能のフリーズ', '映像解析のフリーズ'],
    ['その他エラー', 'その他エラー'],
  ];
  // 常設トラカン(様式1・2)の異常フラグ
  const FIXED_FLAG_LABELS = [
    ['停電', '停電'], ['ループ異常', 'ループ異常'], ['超音波異常', '超音波異常'], ['欠測', '欠測フラグ'],
  ];

  // 異常フラグが立っている項目の一覧（フラグが無い古いJSONでは空配列）
  function stationReasons(st) {
    const out = [];
    if (st.type === 'CCTVトラカン') {
      const fl = st.f3 && st.f3.flags;
      CCTV_FLAG_LABELS.forEach(([key, label]) => { if (flagIsOn(fl, key)) out.push(label); });
    } else {
      ['f1', 'f2'].forEach((fk) => {
        const fl = st[fk] && st[fk].flags;
        ['上り', '下り'].forEach((dir) => {
          FIXED_FLAG_LABELS.forEach(([key, label]) => {
            if (flagIsOn(fl, `${dir}・${key}`)) out.push(`${dir}・${label}`);
          });
        });
      });
    }
    return [...new Set(out)];
  }

  function hasFlags(st) {
    return !!((st.f1 && st.f1.flags) || (st.f2 && st.f2.flags) || (st.f3 && st.f3.flags));
  }

  // 欠測(null)を 0台 と混同しないための補助関数
  function numOrNull(x) { return (typeof x === 'number') ? x : null; }

  // 1つの様式の方向別合計。全項目が空なら null を返す
  function dirTotal(f, dir) {
    if (!f) return null;
    const tot = numOrNull(f[dir + '_tot']);
    if (tot !== null) return tot;
    const s = numOrNull(f[dir + '_s']);
    const l = numOrNull(f[dir + '_l']);
    const u = numOrNull(f[dir + '_u']);   // 車種判別不能（古いJSONには無い）
    if (s === null && l === null && u === null) return null;
    return (s || 0) + (l || 0) + (u || 0);
  }

  // 表示に使う値を選ぶ: 1時間値(様式4→2)を優先し、無ければ5分値(様式3→1)×12で換算
  function pickBasis(st) {
    const order = [['f4', 1, '1時間値'], ['f2', 1, '1時間値'], ['f3', 12, '5分値×12換算'], ['f1', 12, '5分値×12換算']];
    for (const [key, mult, label] of order) {
      const u = dirTotal(st[key], 'up');
      const d = dirTotal(st[key], 'down');
      if (u !== null || d !== null) {
        return { up: u === null ? null : u * mult, down: d === null ? null : d * mult, label, converted: mult !== 1 };
      }
    }
    return null; // 全様式で値が空 = データなし
  }

  // 時間コード(JST, YYYYMMDDhhmm)を表示用に整形
  function parseTc(tc) {
    const y = tc.slice(0, 4), mo = tc.slice(4, 6), d = tc.slice(6, 8), h = tc.slice(8, 10), mi = tc.slice(10, 12);
    return { y, mo, d, h, mi, date: new Date(`${y}-${mo}-${d}T${h}:${mi}:00+09:00`) };
  }
  function fmtTc5m(tc) {
    const t = parseTc(tc);
    const end = String(Number(t.mi) + 4).padStart(2, '0');
    return `${t.y}/${t.mo}/${t.d} ${t.h}:${t.mi}〜${t.h}:${end}`;
  }
  function fmtTc1h(tc) {
    const t = parseTc(tc);
    return `${t.y}/${t.mo}/${t.d} ${t.h}:00〜${t.h}:59`;
  }

  function createPillarPolygon(centerLng, centerLat, radiusMeters, heightMeters, direction, meta) {
    const coords = [];
    const steps = 14;
    const latOffset = radiusMeters / 111000;
    const lngOffset = radiusMeters / (111000 * Math.cos(centerLat * Math.PI / 180));

    for (let i = 0; i <= steps; i++) {
      const angle = (i / steps) * 2 * Math.PI;
      coords.push([
        centerLng + lngOffset * Math.cos(angle),
        centerLat + latOffset * Math.sin(angle)
      ]);
    }

    return {
      "type": "Feature",
      "geometry": { "type": "Polygon", "coordinates": [coords] },
      "properties": {
        "direction": direction,
        "height": Math.max(heightMeters, 15),
        "nodata": !!meta.nodata,
        "code": meta.code
      }
    };
  }

  async function loadTrafficData() {
    const statusLabel = document.getElementById('status-label');
    try {
      const res = await fetch('./traffic_data.json');
      const data = await res.json();
      allStations = data;

      // グラフ用データ（失敗してもサイト本体の表示には影響させない）
      fetch('./traffic_series.json', { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => { seriesData = j; })
        .catch(() => {});

      // 最終更新時刻(generated_at)・データ時刻・遅延の明示
      const gen = data.find(s => s.generated_at);
      const first = data.find(s => s.time_5m && s.time_1h);
      let statusHtml = `● ${data.length} 地点を表示（交通量APIの参考値）`;
      let warn = false;
      let ageMin = null;
      if (gen) {
        const g = String(gen.generated_at).replace(' JST', '');
        statusHtml += `<br><span class="sub">最終更新(JST): ${g.slice(0, 16).replace(/-/g, '/')}</span>`;
        ageMin = (Date.now() - new Date(g.replace(' ', 'T') + '+09:00').getTime()) / 60000;
      }
      if (first) {
        statusHtml += `<br><span class="sub">データ時刻(JST): 5分値 ${fmtTc5m(first.time_5m)} ／ 1時間値 ${fmtTc1h(first.time_1h)}</span>`;
        if (ageMin === null) ageMin = (Date.now() - parseTc(first.time_5m).date.getTime()) / 60000;
      }
      if (ageMin !== null && ageMin > 90) {
        warn = true;
        statusHtml += '<br>⚠ 最終更新から90分以上経っています。更新が止まっている可能性があります。';
      }
      statusHtml += '<br><span class="sub">観測から約20分遅れで提供されるデータです。概ね30分ごとに自動更新しています。</span>';
      statusLabel.innerHTML = statusHtml;
      if (warn) statusLabel.classList.add('warn');

      const pillarFeatures = [];

      data.forEach(st => {
        const basis = pickBasis(st);
        const nodata = basis === null;
        const upVal = nodata ? 0 : (basis.up || 0);
        const downVal = nodata ? 0 : (basis.down || 0);

        st.nodata = nodata;
        st.basisLabel = nodata ? null : basis.label;
        st.upRaw = nodata ? null : basis.up;       // null = 欠測
        st.downRaw = nodata ? null : basis.down;   // null = 欠測
        st.totalDisplay = upVal + downVal;

        pillarFeatures.push(createPillarPolygon(
          st.lng - 0.00022, st.lat, 16, upVal * 0.35, '上り', { code: st.code, nodata: nodata || st.upRaw === null }
        ));
        pillarFeatures.push(createPillarPolygon(
          st.lng + 0.00022, st.lat, 16, downVal * 0.35, '下り', { code: st.code, nodata: nodata || st.downRaw === null }
        ));
      });

      // データあり → 交通量の多い順、データなしは末尾
      data.sort((a, b) => (a.nodata - b.nodata) || (b.totalDisplay - a.totalDisplay));

      const listContainer = document.getElementById('ranking-container');
      listContainer.innerHTML = '';

      data.forEach((st, idx) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        const fmtDir = (v) => (v === null ? '欠測' : v);
        const noDataText = (x) => {
          const r = stationReasons(x);
          if (r.length) return `データなし（${r.join('・')}）`;
          return hasFlags(x) ? 'データなし（異常フラグなし。欠測または未提供）' : 'データなし（欠測または未提供）';
        };
        const sub = st.nodata
          ? noDataText(st)
          : `上り:${fmtDir(st.upRaw)} / 下り:${fmtDir(st.downRaw)} <span style="color:#6b7280;">(${st.basisLabel})</span>`;
        const val = st.nodata
          ? '<span class="traffic-unit">データなし</span>'
          : `${st.totalDisplay} <span class="traffic-unit">台/時</span>`;
        item.innerHTML = `
          <div class="rank-num">${st.nodata ? '-' : idx + 1}</div>
          <div class="station-info">
            <div class="station-name">地点: ${st.code} (${st.type})</div>
            <div class="station-sub">${sub}</div>
          </div>
          <div class="traffic-val">${val}</div>
        `;
        item.onclick = () => flyToStation(st);
        listContainer.appendChild(item);
      });

      if (map.getSource('traffic-pillars')) {
        map.getSource('traffic-pillars').setData({
          type: 'FeatureCollection',
          features: pillarFeatures
        });
      } else {
        map.addSource('traffic-pillars', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: pillarFeatures }
        });

        map.addLayer({
          'id': 'traffic-pillars-3d',
          'type': 'fill-extrusion',
          'source': 'traffic-pillars',
          'paint': {
            'fill-extrusion-color': [
              'match', ['get', 'direction'],
              '上り', ['case', ['get', 'nodata'], '#6b7280', '#3b82f6'],
              '下り', ['case', ['get', 'nodata'], '#6b7280', '#ef4444'],
              '#fbbf24'
            ],
            'fill-extrusion-height': ['get', 'height'],
            'fill-extrusion-base': 0,
            'fill-extrusion-opacity': 0.92
          }
        });

        map.on('click', 'traffic-pillars-3d', (e) => {
          const code = e.features[0].properties.code;
          const st = allStations.find(s => s.code == code);
          if (st) flyToStation(st);
        });
      }

    } catch (err) {
      console.error(err);
      statusLabel.innerText = '✕ データ読み込みエラー';
    }
  }

  map.on('load', () => {
    if (map.getSource('openmaptiles')) {
      map.addLayer({
        'id': '3d-buildings',
        'source': 'openmaptiles',
        'source-layer': 'building',
        'type': 'fill-extrusion',
        'minzoom': 13,
        'paint': {
          'fill-extrusion-color': '#b0bec5',
          'fill-extrusion-height': ['case', ['has', 'render_height'], ['get', 'render_height'], 14],
          'fill-extrusion-base': ['case', ['has', 'render_min_height'], ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.82
        }
      });
    }

    loadTrafficData();
  });
</script>

</body>
</html>
