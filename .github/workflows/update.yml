name: Update Traffic Data

on:
  schedule:
    # 5時間ループのバトンを繋ぐための定期トリガー（どれか1つでも5時間の間に発火すればリレーが継続する）
    - cron: '12,42 * * * *'
    - cron: '27,57 21-23 * * 0-4'
  workflow_dispatch:

# 実行中の5時間ループがある間、後から来たcronを1つだけ「待機(Pending)」としてキープし、リレーさせる
concurrency:
  group: traffic-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 交通量データを連続更新する（朝ピーク10分間隔／通常30分間隔・5時間リレー）
        env:
          TZ: Asia/Tokyo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          start_sec=$(date +%s)
          # 1回のジョブで5時間（18000秒）連続でループを回す
          max_duration=18000

          while true; do
            today=$(date +%Y%m%d)
            dow=$(date +%u)
            now=$((10#$(date +%H%M)))

            # 実験期間(11/9〜11/20)の平日の朝(7:00〜9:10)は10分間隔(FAST_MODE=1)、それ以外は30分間隔(FAST_MODE=0)
            if [ "$today" -ge 20261109 ] && [ "$today" -le 20261120 ] && [ "$dow" -le 5 ] && [ "$now" -ge 700 ] && [ "$now" -lt 910 ]; then
              export FAST_MODE=1
              wait_sec=600
              mode_label="朝ピーク10分間隔モード"
            else
              export FAST_MODE=0
              wait_sec=1800
              mode_label="通常30分間隔モード"
            fi

            echo "=== [$(date '+%Y-%m-%d %H:%M:%S')] 更新開始 ($mode_label) ==="
            git pull --rebase --autostash || true
            python update_traffic.py || echo "Python実行エラー（次回再試行）"

            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "Auto update traffic data"
              git pull --rebase --autostash || true
              git push || echo "push失敗（次回再試行）"
            else
              echo "データの変更なし"
            fi

            # 開始から5時間（18000秒）経過していたらループを終了し、待機中(Pending)の次ジョブへバトンを渡す
            elapsed=$(( $(date +%s) - start_sec ))
            if [ "$elapsed" -ge "$max_duration" ]; then
              echo "5時間経過したためジョブを正常終了し、次のジョブへ引き継ぎます。"
              break
            fi

            echo "次の更新まで $((wait_sec / 60)) 分待機します..."
            sleep $wait_sec
          done
