name: Update Traffic Data

on:
  schedule:
    # 通常時：毎時 15分 と 45分 に実行（30分間隔）
    - cron: '15,45 * * * *'
    # 朝ピーク時（日本時間 7:00〜9:50 = UTC 22:00〜00:50、月〜金）：10分おきに実行
    - cron: '5,25,35,55 22-23 * * 0-4'
    - cron: '5,25,35,55 0 * * 1-5'
  workflow_dispatch:

# 重複実行時は古いジョブが詰まらないようにする
concurrency:
  group: traffic-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 交通量データを取得して保存する
        env:
          TZ: Asia/Tokyo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          today=$(date +%Y%m%d)
          dow=$(date +%u)
          now=$((10#$(date +%H%M)))

          # 実験期間(11/9〜11/20)のではない平日の朝(7:00〜9:55)に、朝用cron(05,25,35,55分)で起動した場合はスキップ
          minute=$((10#$(date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$minute" != "15" ] && [ "$minute" != "45" ]; then
              if [ "$today" -lt 20261109 ] || [ "$today" -gt 20261120 ] || [ "$dow" -gt 5 ]; then
                echo "実験期間の平日ではないためスキップします。"
                exit 0
              fi
            fi
          fi

          # 実験期間の平日の朝(7:00〜9:10)は高速モード(FAST_MODE=1)で素早く更新し、
          # 9:10以降は通常モード(FAST_MODE=0)で朝ピークの実験比較(traffic_experiment.json)も含めて完全更新する
          if [ "$today" -ge 20261109 ] && [ "$today" -le 20261120 ] && [ "$dow" -le 5 ] && [ "$now" -ge 700 ] && [ "$now" -lt 910 ]; then
            export FAST_MODE=1
          else
            export FAST_MODE=0
          fi

          python update_traffic.py

          git add -A
          if ! git diff --staged --quiet; then
            # 重要：[skip ci] を付けないことで、毎回確実に GitHub Pages のサイト更新を走らせる
            git commit -m "Auto update traffic data"
            git pull --rebase --autostash
            git push
          else
            echo "データの変更はありませんでした。"
          fi
