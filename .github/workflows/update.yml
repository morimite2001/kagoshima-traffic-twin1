name: Update Traffic Data

on:
  schedule:
    # 毎時 15分 と 45分 に自動実行（30分間隔）
    - cron: '15,45 * * * *'
  workflow_dispatch:

# 同時に複数のジョブが走って git push が衝突するのを防ぐ
concurrency:
  group: traffic-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 交通量データを取得して保存する
        env:
          TZ: Asia/Tokyo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          today=$(date +%Y%m%d)
          dow=$(date +%u)
          now=$((10#$(date +%H%M)))

          # 直近4分以内にすでに更新コミットがある場合は、別ジョブがループ実行中とみなして即終了（キュー詰まり防止）
          last_commit_sec=$(git log -1 --format=%ct || echo 0)
          now_sec=$(date +%s)
          if [ $((now_sec - last_commit_sec)) -lt 240 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "直近で更新されているためスキップします。"
            exit 0
          fi

          # 実験期間(11/9〜11/20)の平日の朝(7:10〜9:15)は、9:15まで5分(300秒)おきに高頻度更新する
          # （※APIは25分前の5分値を返すため、実時刻 7:15〜9:15 に取得すると 6:50〜8:50 のデータを網羅できます）
          if [ "$today" -ge 20261109 ] && [ "$today" -le 20261120 ] && [ "$dow" -le 5 ] && [ "$now" -ge 710 ] && [ "$now" -lt 915 ]; then
            echo "実験期間の平日の朝ピーク時間帯のため、9:15まで5分ごとに高速更新します。"
            while true; do
              FAST_MODE=1 python update_traffic.py || echo "高速更新に失敗しました"

              git add -A
              if ! git diff --staged --quiet; then
                git commit -m "Auto update traffic data (morning peak)"
                git pull --rebase --autostash || true
                git push || true
              fi

              now=$((10#$(date +%H%M)))
              if [ "$now" -ge 915 ]; then
                break
              fi
              sleep 300
            done
          fi

          # 通常更新（朝ループが終わった直後の 9:15 すぎにも1回実行し、履歴CSVや実験比較を完全更新する）
          FAST_MODE=0 python update_traffic.py

          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto update traffic data"
            git pull --rebase --autostash
            git push
          fi
